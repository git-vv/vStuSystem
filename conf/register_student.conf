# registerStudent 服务配置文件

[server]
# 服务端口
port = 18080
# 域名配置（为空则自动获取服务器IP，配置后页面链接将使用域名）
domain =

[ssl]
# 是否启用HTTPS（默认开启，摄像头扫码功能需要HTTPS）
enabled = false
# SSL证书文件路径
cert = ./conf/ssl/server.crt
# SSL私钥文件路径
key = ./conf/ssl/server.key

[log]
# 日志文件路径（为空则仅输出到控制台）
path = ./logs/register_student.log
# 单个日志文件最大大小（字节），超过后回滚，最小1000字节
max_size = 10485760
# 日志回滚文件个数（0表示不回滚）
max_files = 5

[db]
# 数据库文件路径
path = ./data/register_student.db

[upload]
# 二维码图片存储路径（必须配置，否则服务启动失败）
path = ./data/uploads

[log_db]
# 操作日志数据库路径
path = ./data/operation_log.db
