<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活动报名</title>
    <link rel="stylesheet" href="/static/css/activity.css">
</head>
<body>
    <div class="page-wrapper">
        <div id="promotion-section" style="display:none;">
            <div id="promotion-carousel"></div>
            <div id="promotion-text" class="promotion-text" style="display:none;"></div>
        </div>

        <div class="page-header">
            <h1 class="page-title">星芽活动报名</h1>
        </div>

        <div id="activity-list" class="activity-list">
            <div class="loading" id="loading">加载中...</div>
        </div>

        <div id="load-more-container" style="display:none; text-align:center; padding:16px;"></div>

        <div id="empty-tip" class="empty-tip" style="display:none;">
            暂无活动
        </div>

        <div id="desc-modal" class="desc-modal-overlay" style="display:none;" onclick="closeDescModal()">
            <div class="desc-modal-content" onclick="event.stopPropagation()">
                <div class="desc-modal-title" id="desc-modal-title"></div>
                <div class="desc-modal-body" id="desc-modal-body"></div>
                <button class="desc-modal-close" onclick="closeDescModal()">关闭</button>
            </div>
        </div>

        <div id="about-us-section" style="display:none;">
            <hr style="border:none; border-top:1px solid #e2e8f0; margin:24px 16px 16px;">
            <div style="text-align:center; padding:0 16px 16px;">
                <h2 style="font-size:1.1rem; font-weight:600; color:#2d3748; margin:0;">关于我们</h2>
            </div>
            <div id="about-us-cards" style="padding:0 12px 20px;"></div>
        </div>
    </div>

    <!-- Signup modal (bottom sheet) -->
    <div id="signup-modal" class="modal-overlay" style="display:none;">
        <div class="modal-sheet">
            <div class="sheet-header">
                <span class="sheet-title" id="signup-activity-title">活动报名</span>
                <button class="sheet-close" onclick="closeSignupModal()">&times;</button>
            </div>

            <div id="signup-form">
                <div class="form-group">
                    <label>姓名 <span class="required">*</span></label>
                    <input type="text" id="signup-name" class="form-input" placeholder="请输入姓名" maxlength="50">
                </div>
                <div class="form-group">
                    <label>手机号 <span class="required">*</span></label>
                    <input type="tel" id="signup-phone" class="form-input" placeholder="请输入手机号" maxlength="11">
                </div>
                <div class="form-group">
                    <label>年级</label>
                    <select id="signup-grade" class="form-input">
                        <option value="">请选择年级</option>
                        <option value="一年级">一年级</option>
                        <option value="二年级">二年级</option>
                        <option value="三年级">三年级</option>
                        <option value="四年级">四年级</option>
                        <option value="五年级">五年级</option>
                        <option value="六年级">六年级</option>
                        <option value="七年级(初一)">七年级(初一)</option>
                        <option value="八年级(初二)">八年级(初二)</option>
                        <option value="九年级(初三)">九年级(初三)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>报名类型</label>
                    <select id="signup-type" class="form-input">
                        <option value="">请选择报名类型</option>
                        <option value="全托">全托</option>
                        <option value="晚托">晚托</option>
                        <option value="午托">午托</option>
                    </select>
                </div>
                <div class="form-group" id="invite-code-group" style="display:none;">
                    <label>邀请码 <span class="invite-hint">(留空发起拼团，填入加入拼团)</span></label>
                    <div class="invite-code-wrapper">
                        <input type="text" id="signup-invite-code" class="form-input" placeholder="输入6位邀请码" maxlength="6" style="text-transform:uppercase;">
                        <button type="button" class="scan-btn" id="scan-btn" onclick="startScan()" title="扫码">
                            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
                                <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
                                <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
                                <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
                                <rect x="7" y="7" width="10" height="10" rx="1"/>
                            </svg>
                        </button>
                        <input type="file" id="qr-file-input" accept="image/*" style="display:none;" onchange="handleQRImage(event)">
                    </div>
                </div>
                <div class="leader-warning" id="leader-warning" style="display:none;">
                    <span class="leader-warning-icon">&#9888;</span> 团长请勿退出此页面，否则拼团将被解散！
                </div>
                <div id="batch-members-area" style="display:none;">
                    <div class="batch-header">请同时登记 <span id="batch-count-label">2</span> 位学生信息</div>
                    <div id="batch-members-form"></div>
                </div>
                <div class="form-error" id="signup-error"></div>
                <button class="btn-submit" id="signup-btn" onclick="submitSignup()">提交报名</button>
            </div>

            <div id="group-waiting" style="display:none;">
                <div class="waiting-header">
                    <div class="waiting-title">等待拼团成员</div>
                    <div class="waiting-progress" id="waiting-progress">1/3 人已报名</div>
                </div>
                <div class="waiting-code" id="waiting-invite-code">ABC123</div>
                <div class="waiting-code-hint">将邀请码分享给好友</div>
                <div class="waiting-qrcode" id="waiting-qrcode"></div>
                <div id="session-share-section" style="display:none;">
                    <div class="session-share-hint">分享链接邀请好友加入拼团</div>
                    <div class="session-share-buttons">
                        <button class="btn-share btn-share-link" onclick="copyShareLink()">复制分享链接</button>
                        <button class="btn-share btn-share-card" onclick="copyShareCard()">复制成卡片</button>
                    </div>
                    <div class="session-share-reminder">复制邀请信息发给小伙伴，邀请TA一起拼团</div>
                </div>
                <div id="waiting-group-image-section" style="display:none;">
                    <img id="waiting-group-image" class="group-image" src="" alt="加群二维码">
                    <div class="waiting-group-image-hint">请扫码加入活动群，拼团结果将在群内通知</div>
                </div>
                <div class="waiting-members" id="waiting-members"></div>
                <button class="btn-submit btn-confirm" id="waiting-confirm-btn" style="display:none;" onclick="confirmGroup()">确认报名</button>
                <button class="btn-submit btn-cancel" onclick="cancelGroup()">取消拼团</button>
            </div>

            <div id="signup-success" style="display:none;">
                <div class="success-icon">&#10003;</div>
                <div class="success-text">报名成功!</div>
                <div class="group-image-section" id="group-image-section" style="display:none;">
                    <div class="group-image-hint">请务必扫码加群，未加群视为报名无效！</div>
                    <img id="group-image" class="group-image" src="" alt="加群二维码">
                </div>
                <button class="btn-submit btn-secondary" onclick="closeSignupModal()">完成</button>
            </div>
        </div>
    </div>

    <div id="scanner-overlay" class="scanner-overlay" style="display:none;">
        <div class="scanner-header">
            <span class="scanner-title">扫描邀请码</span>
            <button type="button" class="scanner-close" onclick="stopScan()">&times;</button>
        </div>
        <div class="scanner-body">
            <video id="scanner-video" autoplay playsinline></video>
            <canvas id="scanner-canvas" style="display:none;"></canvas>
            <div class="scanner-frame">
                <div class="scanner-line"></div>
            </div>
        </div>
        <div class="scanner-hint">将二维码放入框内自动识别</div>
    </div>

    <div id="scan-mode-sheet" class="scan-mode-sheet" style="display:none;">
        <div class="scan-mode-mask" onclick="closeScanSheet()"></div>
        <div class="scan-mode-panel">
            <div class="scan-mode-title">选择扫码方式</div>
            <div class="scan-mode-option" onclick="pickCameraScan()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
                    <circle cx="12" cy="13" r="4"/>
                </svg>
                <span>实时扫描</span>
            </div>
            <div class="scan-mode-option" onclick="pickAlbumScan()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
                    <circle cx="8.5" cy="8.5" r="1.5"/>
                    <polyline points="21 15 16 10 5 21"/>
                </svg>
                <span>从相册选择</span>
            </div>
            <div class="scan-mode-cancel" onclick="closeScanSheet()">取消</div>
        </div>
    </div>

    <div id="notice-overlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.6); z-index:9999; justify-content:center; align-items:center;">
        <div style="background:#fff; border-radius:12px; max-width:420px; width:90%; max-height:80vh; display:flex; flex-direction:column; overflow:hidden;">
            <div style="background:#c53030; color:#fff; padding:16px 20px; font-size:1.2rem; font-weight:700; text-align:center; border-radius:12px 12px 0 0;">
                活动须知
            </div>
            <div id="notice-content" style="padding:16px 20px; overflow-y:auto; flex:1; font-size:0.95rem; line-height:1.7; white-space:pre-wrap; word-break:break-word;">
            </div>
            <div style="padding:12px 20px; border-top:1px solid #e2e8f0;">
                <div style="display:flex; align-items:center; gap:8px; margin-bottom:12px;">
                    <input type="checkbox" id="notice-checkbox" disabled style="width:18px; height:18px; accent-color:#c53030;">
                    <label for="notice-checkbox" id="notice-checkbox-label" style="font-size:0.9rem; color:#4a5568; cursor:not-allowed;">
                        已完成阅读并自愿遵守活动规则 (<span id="notice-countdown">10</span>s)
                    </label>
                </div>
                <button id="notice-confirm-btn" disabled style="width:100%; padding:10px; border:none; border-radius:8px; background:#cbd5e0; color:#a0aec0; font-size:1rem; cursor:not-allowed;">
                    确认
                </button>
            </div>
        </div>
    </div>

    <div id="fullscreen-viewer" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:#000; z-index:10000;">
        <div id="fullscreen-track" style="display:flex; height:100%; transition:transform 0.3s ease;">
        </div>
        <div id="fullscreen-dots" style="position:absolute; bottom:20px; left:0; right:0; display:flex; justify-content:center; gap:6px;">
        </div>
    </div>

    <div id="share-card-modal" class="share-card-modal" style="display:none;">
        <div class="share-card-inner">
            <div class="share-card-header">拼团邀请卡片</div>
            <div class="share-card-body">
                <canvas id="share-card-canvas" width="600" height="900" style="max-width:100%; height:auto; border-radius:8px;"></canvas>
            </div>
            <div class="share-card-footer">
                <button class="btn-submit btn-copy-card" onclick="copyCardImage()">复制卡片图片</button>
                <button class="btn-submit btn-secondary" onclick="closeCardPreview()">关闭</button>
            </div>
        </div>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/qrcode.min.js"></script>
    <script src="/static/js/jsqr.min.js"></script>
    <script src="/static/js/activity.js"></script>
</body>
</html>
