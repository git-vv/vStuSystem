<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源管理 - 星芽教务系统</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <a href="/" class="back-link-top">&larr; 首页</a>
            <h1>资源管理</h1>
            <div class="user-bar">
                <span class="user-name" id="user-name"></span>
                <button class="btn-logout" onclick="handleLogout()">退出</button>
            </div>
        </header>

        <!-- Add resource -->
        <div class="section">
            <div class="section-title">添加资源</div>
            <form id="add-form" onsubmit="handleAddResource(event)">
                <div class="form-row">
                    <div class="form-group">
                        <label>资源类型 <span class="required">*</span></label>
                        <select class="form-control" id="res-type" onchange="onResourceTypeChange()">
                            <option value="0">其他</option>
                            <option value="1">床位</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>资源名称 <span class="required">*</span></label>
                        <input type="text" class="form-control" id="res-name" placeholder="如：教材、桌椅等" required>
                    </div>
                    <div class="form-group">
                        <label>总数量 <span class="required">*</span></label>
                        <input type="number" class="form-control" id="res-total" min="1" value="1" required>
                    </div>
                </div>
                <div class="form-error" id="add-error"></div>
                <button type="submit" class="btn btn-success btn-block" id="add-btn">添加资源</button>
            </form>
        </div>

        <!-- Resource list -->
        <div class="section">
            <div class="section-title">资源列表</div>
            <div id="resource-list"></div>
        </div>

        <!-- Resource usage (shown in modal) -->
        <div class="modal-overlay" id="usage-modal">
            <div class="modal-content">
                <button class="modal-close" onclick="App.hideModal('usage-modal')">&times;</button>
                <div class="modal-title" id="usage-title">资源使用详情</div>
                <div id="usage-detail"></div>
            </div>
        </div>

        <!-- Edit resource modal -->
        <div class="modal-overlay" id="edit-modal">
            <div class="modal-content">
                <button class="modal-close" onclick="App.hideModal('edit-modal')">&times;</button>
                <div class="modal-title">修改资源</div>
                <form id="edit-form" onsubmit="handleEditResource(event)">
                    <input type="hidden" id="edit-res-id">
                    <div class="form-group">
                        <label>资源名称</label>
                        <input type="text" class="form-control" id="edit-res-name" readonly>
                    </div>
                    <div class="form-group">
                        <label>总数量 <span class="required">*</span></label>
                        <input type="number" class="form-control" id="edit-res-total" min="1" required>
                    </div>
                    <div class="form-error" id="edit-error"></div>
                    <div class="btn-group">
                        <button type="submit" class="btn btn-primary">保存</button>
                        <button type="button" class="btn btn-secondary" onclick="App.hideModal('edit-modal')">取消</button>
                    </div>
                </form>
            </div>
        </div>

        <a href="/" class="back-link">&larr; 返回首页</a>
    </div>

    <script src="/static/js/app.js"></script>
    <script src="/static/js/resource.js"></script>
</body>
</html>
